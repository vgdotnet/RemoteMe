name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build RemoteMe.slnx -c Release

      - name: Test
        run: dotnet test RemoteMe.slnx -c Release --no-build

      - name: Check formatting
        run: dotnet format RemoteMe.slnx --verify-no-changes --no-restore
